[pytest]
# Pytest configuration for Logcelot

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Async support
asyncio_mode = auto

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Docker services)
    slow: Slow tests (>1 second)

# Coverage settings
[coverage:run]
source = src
omit =
    tests/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

